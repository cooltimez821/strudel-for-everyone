<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNA Academy — Interactive Certified Nursing Assistant Learning</title>
  <meta name="description" content="An interactive learning experience for Certified Nursing Assistant students: lessons, flashcards, practice quizzes, a skills lab, and real-world scenarios.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" data-nav="dashboard" aria-label="CNA Academy home">
        <span class="brand-icon">🩺</span>
        <span class="brand-text">CNA <strong>Academy</strong></span>
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-btn" data-nav="dashboard">🏠 <span>Dashboard</span></button>
        <button class="nav-btn" data-nav="learn">📖 <span>Learn</span></button>
        <button class="nav-btn" data-nav="flashcards">🃏 <span>Flashcards</span></button>
        <button class="nav-btn" data-nav="quiz">✅ <span>Quiz</span></button>
        <button class="nav-btn" data-nav="skills">🧤 <span>Skills Lab</span></button>
        <button class="nav-btn" data-nav="scenarios">🎭 <span>Scenarios</span></button>
      </nav>
      <div class="header-stats">
        <span class="stat-chip" id="streakChip" title="Daily study streak">🔥 <b id="streakCount">0</b></span>
        <span class="stat-chip" id="xpChip" title="Experience points">⭐ <b id="xpCount">0</b> XP</span>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="site-footer">
    <p>CNA Academy is a free, open-source study companion. It is for education only and is not medical advice —
    always follow your state's curriculum, your facility's policies, and the care plan.</p>
  </footer>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="confettiHost" class="confetti-host" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
